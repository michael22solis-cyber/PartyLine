<!doctype html><meta charset="utf-8"><style>
body { margin: 0; width: 720px; height: 960px; overflow: hidden; background: #3a2a22 radial-gradient(circle at 40% 30%, #6b4b3a, #20140f 85%); font-family: 'Liberation Serif', 'DejaVu Serif', serif; }
.doily { position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; margin: -380px; border-radius: 50%; background: repeating-radial-gradient(circle, rgba(240,232,215,.16) 0 6px, transparent 6px 14px), repeating-conic-gradient(rgba(240,232,215,.12) 0 4deg, transparent 4deg 10deg); }

.verse { font-style: italic; font-size: 20px; line-height: 1.5; margin: 34px 26px 0; }

</style>
<div class="doily"></div>
<div class="card"><div class="frame"></div>
<div class="cross">✝</div><div class="in">In Loving Memory of</div>
<div class="name">Dana Whitlock</div><div class="date">Called home October 29</div>
<div class="verse">The Lord is my shepherd;<br>I shall not want.<br>He leadeth me beside<br>the still waters.</div>
<div class="parish">ST. AGNES PARISH</div></div>
